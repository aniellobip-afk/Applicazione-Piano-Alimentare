<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2C6B4C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Piano pasti settimanale</title>
<style>
  :root{
    --ink:#16252B;
    --muted:#5E6E73;
    --paper:#F2F5F1;
    --card:#FFFFFF;
    --line:#D5DDD6;
    --basil:#2C6B4C;
    --basil-dark:#1F4F38;
    --lemon:#F3DA4A;
    --plum:#6B2E4F;
    --carb:#D9822B;
    --carb-soft:#FBEBD6;
    --radius:14px;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;
    font-size:16px;line-height:1.45;
  }
  .wrap{max-width:720px;margin:0 auto;padding:20px 16px 80px}
  h1{
    font-family:Georgia,"Iowan Old Style","Times New Roman",serif;
    font-size:30px;line-height:1.1;margin:8px 0 4px;font-weight:700;letter-spacing:-.01em;
  }
  h2,h3{margin:0}
  .sub{color:var(--muted);margin:0 0 18px;font-size:15px}

  /* Schede principali */
  .tabs{display:flex;gap:4px;background:#E3E9E3;padding:4px;border-radius:12px;margin-bottom:18px}
  .tabs button{
    flex:1;border:0;background:transparent;padding:10px 4px;border-radius:9px;
    font:inherit;font-weight:600;font-size:15px;color:var(--muted);cursor:pointer;
  }
  .tabs button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
  .badge{
    display:inline-block;min-width:22px;padding:0 6px;margin-left:5px;border-radius:11px;
    background:var(--basil);color:#fff;font-size:13px;line-height:22px;text-align:center;
  }

  /* Giorni */
  .days{display:flex;gap:6px;overflow-x:auto;padding:7px 6px 6px 0;margin-bottom:8px;scrollbar-width:thin}
  .day{
    flex:1 0 auto;min-width:56px;border:1.5px solid var(--line);background:var(--card);
    border-radius:12px;padding:8px 6px;font:inherit;cursor:pointer;text-align:center;color:var(--ink);
  }
  .day b{display:block;font-size:15px}
  .day small{display:block;color:var(--muted);font-size:12px;min-height:16px}
  .day[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
  .day[aria-pressed="true"] small{color:#C8D4CC}
  .day-title{font-family:Georgia,serif;font-size:22px;margin:4px 0 12px;font-weight:700}

  /* Pasti */
  .meal{
    background:var(--card);border:1px solid var(--line);border-left:6px solid var(--basil);
    border-radius:var(--radius);padding:14px 14px 12px;margin-bottom:12px;
  }
  .meal.snack{border-left-color:var(--lemon)}
  .meal.dinner{border-left-color:var(--plum)}
  .meal-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
  .meal-head h3{font-size:18px}
  .meal-head span{color:var(--muted);font-size:14px}
  .rows{display:flex;flex-direction:column;gap:8px}
  .empty{color:var(--muted);font-size:14px;margin:2px 0 0}

  .entry{
    display:flex;gap:8px;align-items:center;justify-content:space-between;
    border:1px solid var(--line);border-radius:10px;padding:8px 6px 8px 12px;background:#F9FBF8;
  }
  .entry-name{font-weight:600}
  .entry-sub{display:block;color:var(--muted);font-size:13px}

  .row{display:grid;grid-template-columns:1fr 70px 74px 36px;gap:6px;align-items:center}
  input,select{
    font:inherit;color:var(--ink);background:#fff;border:1.5px solid var(--line);
    border-radius:10px;padding:9px 10px;width:100%;min-width:0;
  }
  input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--lemon);outline-offset:1px;border-color:var(--ink)}
  .del{
    border:0;background:transparent;color:var(--muted);font-size:22px;line-height:1;
    cursor:pointer;height:38px;min-width:36px;border-radius:10px;
  }
  .del:hover{background:#F0E4E4;color:#9B2C2C}
  .add{
    margin-top:10px;border:1.5px dashed var(--basil);background:transparent;color:var(--basil-dark);
    font:inherit;font-weight:600;padding:9px 12px;border-radius:10px;cursor:pointer;width:100%;
  }
  .add:hover{background:#E8F1EA}

  /* Selettore ricette */
  .picker{margin-top:10px;border:1.5px solid var(--ink);border-radius:12px;padding:12px;background:#fff}
  .picker-label{font-weight:600;font-size:14px;margin:0 0 6px}
  .pick-list{display:flex;flex-direction:column;gap:6px;margin:12px 0 10px;max-height:300px;overflow:auto}
  .pick{
    text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:10px;
    padding:10px 12px;font:inherit;cursor:pointer;color:var(--ink);
  }
  .pick:hover{border-color:var(--basil);background:#F1F7F2}
  .pick b{display:block}
  .picker-foot{display:flex;gap:8px;flex-wrap:wrap}

  /* Chip e tag */
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{
    border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 13px;
    font:inherit;font-size:14px;cursor:pointer;color:var(--ink);
  }
  .chip[aria-pressed="true"]{background:var(--basil);border-color:var(--basil);color:#fff}
  .chip:disabled{cursor:default;opacity:.8}
  .tag{
    display:inline-block;font-size:12px;padding:1px 9px;border-radius:999px;
    background:#E3E9E3;color:var(--basil-dark);margin:0 4px 0 0;font-weight:600;
  }

  /* Ricette */
  .rec-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
  .rec-top h2{font-family:Georgia,serif;font-size:22px}
  .rcard{
    display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);padding:12px 14px;margin-top:10px;font:inherit;color:var(--ink);cursor:pointer;
  }
  .rcard:hover{border-color:var(--basil)}
  .rcard-name{font-weight:700;font-size:17px;display:block;margin-bottom:4px}
  .rcard-meta{display:block;color:var(--muted);font-size:13px;margin-top:4px}
  .editor{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 14px}
  .editor label.lab{display:block;font-weight:600;font-size:14px;margin:0 0 6px}
  .editor .block{margin-bottom:18px}
  .editor h3{font-size:17px;margin-bottom:10px}
  .back{margin-bottom:12px}

  .footer-actions{margin-top:22px;display:flex;justify-content:flex-end}
  .ghost{
    border:1.5px solid var(--line);background:transparent;color:var(--muted);
    font:inherit;padding:9px 14px;border-radius:10px;cursor:pointer;
  }
  .ghost.danger{border-color:#9B2C2C;color:#9B2C2C;font-weight:600}
  .primary{
    border:0;background:var(--basil);color:#fff;font:inherit;font-weight:600;
    padding:10px 16px;border-radius:10px;cursor:pointer;
  }
  .primary:hover{background:var(--basil-dark)}

  /* Lista spesa */
  .tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .shop{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .shop li{border-bottom:1px solid var(--line)}
  .shop li:last-child{border-bottom:0}
  .shop label{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;cursor:pointer}
  .shop input[type=checkbox]{width:22px;height:22px;margin:2px 0 0;accent-color:var(--basil);flex:none;padding:0}
  .item-main{display:flex;justify-content:space-between;gap:12px;flex:1}
  .item-name{font-weight:600}
  .item-qty{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600;color:var(--basil-dark)}
  .item-uses{display:block;color:var(--muted);font-size:13px;margin-top:2px}
  .shop li.done .item-name,.shop li.done .item-qty{text-decoration:line-through;color:var(--muted);font-weight:400}
  .shop li.done .item-uses{display:none}
  .state{color:var(--muted);padding:24px 8px;text-align:center}
  .progress{color:var(--muted);font-size:14px;margin:0 0 10px}

  .opt{display:flex;gap:10px;align-items:center;margin:0 0 12px;font-size:14px;color:var(--muted);cursor:pointer}
  .opt input{width:20px;height:20px;padding:0;accent-color:var(--basil);flex:none}
  .export{margin-top:16px}
  .export summary{cursor:pointer;font-weight:600;padding:8px 0}
  .export textarea{width:100%;font:inherit;border:1.5px solid var(--line);border-radius:10px;padding:10px;min-height:180px;background:#fff;color:var(--ink);resize:vertical}
  textarea:focus-visible{outline:3px solid var(--lemon);outline-offset:1px;border-color:var(--ink)}
  .editor textarea{width:100%;font:inherit;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:10px;min-height:84px;resize:vertical}
  .pick-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .pick-count{white-space:nowrap;font-size:13px;font-weight:600;color:var(--basil-dark);background:#E3EFE7;border-radius:999px;padding:1px 10px}
  .picker-hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .chip:disabled:not([aria-pressed="true"]){opacity:.4;border-style:dashed;cursor:not-allowed}
  .rcard-desc{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14px;margin:0 0 6px}
  .rec-tools{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
  .io-msg{color:var(--basil-dark);font-size:14px;font-weight:600;margin:0 0 10px}
  .day{position:relative}
  .carb-dot{position:absolute;top:-5px;right:-4px;width:13px;height:13px;border-radius:50%;background:var(--carb);border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
  .carb-legend{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:13px;margin:0 0 12px}
  .carb-dot-inline{width:11px;height:11px;border-radius:50%;background:var(--carb);display:inline-block;flex:none}
  .carb-tag{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--carb-soft);color:#9A5712;margin-left:8px;white-space:nowrap;vertical-align:1px}
  .flag{display:flex;gap:10px;align-items:center;font-size:16px;font-weight:600;cursor:pointer}
  .flag input{width:22px;height:22px;padding:0;accent-color:var(--basil);flex:none}
  .entry-main{flex:1;min-width:0;cursor:pointer;border-radius:8px}
  .entry-main:focus-visible{outline:3px solid var(--lemon);outline-offset:2px}
  .overlay{position:fixed;inset:0;z-index:50;background:rgba(22,37,43,.55);display:flex;align-items:center;justify-content:center;padding:16px}
  .overlay[hidden]{display:none}
  .modal{background:#fff;border-radius:20px;width:100%;max-width:440px;max-height:min(80vh,640px);display:flex;flex-direction:column;padding:18px 16px 16px;box-shadow:0 12px 30px rgba(0,0,0,.3)}
  .d-title{font-family:Georgia,serif;font-size:22px;line-height:1.15;margin:0}
  .d-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
  .d-tags .tag{margin:0}
  .d-tags .carb-tag{margin-left:0;vertical-align:baseline}
  .d-scroll{flex:1;min-height:0;overflow:auto;padding-bottom:4px}
  .sec{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:16px 0 6px}
  .d-text{font-size:15px;margin:0;white-space:pre-wrap}
  .ing{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .ing li{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;font-size:15px;border-bottom:1px solid var(--line)}
  .ing li:last-child{border-bottom:0}
  .ing li span:last-child{font-weight:700;color:var(--basil-dark);font-variant-numeric:tabular-nums;white-space:nowrap}
  .d-close{margin-top:12px;width:100%}
  .who{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 14px}
  .seg{display:inline-flex;background:#E3E9E3;padding:3px;border-radius:12px;gap:3px}
  .seg.full{display:flex;margin-bottom:14px}
  .seg button{border:0;background:transparent;padding:8px 16px;border-radius:9px;font:inherit;font-weight:700;color:var(--muted);cursor:pointer}
  .seg.full button{flex:1;padding:9px 6px}
  .seg button[aria-pressed="true"]{background:var(--basil);color:#fff}
  .sync-chip{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
  .sd{display:inline-block;width:9px;height:9px;border-radius:50%;background:#9AA7AB;flex:none}
  .sd-ok{background:var(--basil)}
  .sd-busy{background:var(--lemon)}
  .sd-error{background:#C0392B}
  .sd-off{background:#C9D2CA}
  .field{margin:0 0 12px}
  .field label{display:block;font-weight:600;font-size:14px;margin:0 0 6px}
  .c-line{font-size:14px;color:var(--muted);margin:0 0 10px}
  .c-msg{margin:12px 0 0;font-size:14px;font-weight:600;color:var(--basil-dark)}
  .c-msg.err{color:#9B2C2C}
  @media (max-width:380px){
    .row{grid-template-columns:1fr 60px 66px 32px}
  }
  @media (prefers-reduced-motion:no-preference){
    .tabs button,.day,.add,.primary,.chip,.pick{transition:background-color .15s,color .15s,border-color .15s}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Piano pasti</h1>
  <p class="sub">Crea le ricette, assegnale ai pasti della settimana e ottieni la lista della spesa.</p>

  <div class="who">
    <div class="seg" id="profiles" role="group" aria-label="Profilo"></div>
    <button class="sync-chip" id="sync-chip" aria-label="Sincronizzazione"></button>
  </div>

  <div class="tabs" role="tablist">
    <button role="tab" id="tab-plan" aria-selected="true">Piano</button>
    <button role="tab" id="tab-rec" aria-selected="false">Ricette</button>
    <button role="tab" id="tab-shop" aria-selected="false">Spesa<span class="badge" id="badge" hidden>0</span></button>
  </div>

  <section id="view-plan">
    <div class="days" id="days"></div>
    <p class="carb-legend" id="carb-legend" hidden><span class="carb-dot-inline"></span> Pranzo con carboidrato</p>
    <div id="day-view"></div>
    <div class="footer-actions"><button class="ghost" id="reset">Svuota il piano della settimana</button></div>
  </section>

  <section id="view-rec" hidden><div id="rec-view"></div></section>

  <section id="view-shop" hidden>
    <div class="seg full" id="shop-scope" role="group" aria-label="Lista di"></div>
    <div class="tools">
      <button class="primary" id="share">Condividi nelle note</button>
      <button class="primary" id="copy">Copia la lista</button>
      <button class="ghost" id="uncheck">Azzera le spunte</button>
    </div>
    <label class="opt"><input type="checkbox" id="inc-done"> Includi anche gli articoli già nel carrello</label>
    <p class="progress" id="progress"></p>
    <div id="shop-view"></div>
    <details class="export">
      <summary>Mostra il testo da incollare</summary>
      <textarea id="export-text" readonly rows="10" aria-label="Testo della lista della spesa"></textarea>
    </details>
  </section>

  <div class="overlay" id="detail" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="d-title">
      <h2 class="d-title" id="d-title"></h2>
      <div class="d-tags" id="d-tags"></div>
      <div class="d-scroll" id="d-body"></div>
      <button class="primary d-close" id="d-close">Chiudi</button>
    </div>
  </div>

  <div class="overlay" id="cloud-dlg" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="c-title">
      <h2 class="d-title" id="c-title">Sincronizzazione</h2>
      <div class="d-scroll" id="c-body" style="margin-top:12px"></div>
      <button class="ghost d-close" id="c-close">Chiudi</button>
    </div>
  </div>

  <datalist id="names"></datalist>
  <input type="file" id="imp-file" hidden>
</div>

<script>
const store={
  async get(k){const v=localStorage.getItem(k);return v===null?null:{value:v};},
  async set(k,v){localStorage.setItem(k,v);}
};
if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(()=>{});}
if("serviceWorker" in navigator&&location.protocol.startsWith("http")){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
const DAYS=[["lun","Lunedì","Lun"],["mar","Martedì","Mar"],["mer","Mercoledì","Mer"],["gio","Giovedì","Gio"],["ven","Venerdì","Ven"],["sab","Sabato","Sab"],["dom","Domenica","Dom"]];
// [chiave, etichetta, classe, tag della ricetta corrispondente]
const MEALS=[
  ["colazione","Colazione","meal","colazione"],
  ["spuntino-mattina","Spuntino di mattina","meal snack","spuntino"],
  ["pranzo","Pranzo","meal","pranzo"],
  ["spuntino-pomeriggio","Spuntino del pomeriggio","meal snack","spuntino"],
  ["cena","Cena","meal dinner","cena"]
];
const TAGS=[["colazione","Colazione"],["spuntino","Spuntino"],["pranzo","Pranzo"],["cena","Cena"]];
const UNITS={g:["m",1],pz:["p",1]};
const LEGACY_UNITS={kg:1000,l:1000,ml:1}; // solo per convertire i dati salvati con le vecchie unità
const KEY="piano-pasti-v2", OLD_KEY="piano-pasti-v1";
const KEY3="piano-pasti-v3", ACTIVE_KEY="piano-pasti-attivo", CLOUD_KEY="piano-pasti-cloud", DEV_KEY="piano-pasti-device";
const PROFILES=[["nello","Nello"],["emma","Emma"]];
const SCOPES=["nello","emma","insieme"];

let db=null;                 // tutti i dati locali (due profili + spunte condivise)
let active="nello";          // profilo in uso su questo dispositivo
let state={recipes:[],plan:{}}; // dati del profilo attivo (stesso oggetto di db.profiles[active])
let shopScope="nello";       // lista della spesa mostrata: nello / emma / insieme
let currentTab="plan", pendingUI=false;
let current=DAYS[(new Date().getDay()+6)%7][0];
let picker={meal:null,days:[],all:false};
let editing=null, recFilter="tutte", returnTab=null, focusSel=null;
let ioMsg="";

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const tagLabel=t=>(TAGS.find(x=>x[0]===t)||[,t])[1];

const recipeById=id=>state.recipes.find(r=>r.id===id);
const rname=r=>r.name.trim()||"Ricetta senza nome";
function slot(day,meal){
  state.plan[day]=state.plan[day]||{};
  state.plan[day][meal]=state.plan[day][meal]||[];
  return state.plan[day][meal];
}
function summary(r){
  const n=r.ingredients.map(i=>i.name.trim()).filter(Boolean);
  if(!n.length)return "Nessun ingrediente";
  return n.slice(0,3).join(", ")+(n.length>3?"…":"");
}
function usage(rid){
  let n=0;
  for(const d in state.plan)for(const m in state.plan[d])for(const e of state.plan[d][m])if(e.recipeId===rid)n++;
  return n;
}
function dayCount(day){
  return MEALS.reduce((n,[m])=>n+slot(day,m).filter(e=>recipeById(e.recipeId)).length,0);
}

/* ---------- Normalizzazione dati ---------- */
function fixIngredient(it){
  it=(it&&typeof it==="object")?it:{};
  it.id=it.id||uid();
  it.name=String(it.name==null?"":it.name);
  it.qty=String(it.qty==null?"":it.qty);
  if(it.unit!=="g"&&it.unit!=="pz"){
    const m=LEGACY_UNITS[it.unit]||1;
    const n=parseQty(it.qty);
    if(n&&m!==1)it.qty=String(Math.round(n*m*100)/100);
    it.unit="g";
  }
  return it;
}
function fixRecipe(r){
  r.id=r.id||uid();
  r.name=String(r.name==null?"":r.name);
  r.desc=String(r.desc==null?"":r.desc);
  r.carb=r.carb===true;
  r.tags=Array.isArray(r.tags)?r.tags.filter(t=>TAGS.some(x=>x[0]===t)):[];
  r.ingredients=(Array.isArray(r.ingredients)?r.ingredients:[]).map(fixIngredient);
  return r;
}

/* ---------- Salvataggio ---------- */
function migrate(old){
  // Dalla versione 1: ogni pasto con ingredienti diventa una ricetta collegata
  const s={recipes:[],plan:{},checked:old.checked||{}};
  for(const [dk,full] of DAYS){
    for(const [mk,label,,tag] of MEALS){
      const items=((old.plan||{})[dk]||{})[mk]||[];
      const valid=items.filter(i=>i.name&&i.name.trim());
      if(!valid.length)continue;
      const r={id:uid(),name:`${full} – ${label}`,tags:[tag],ingredients:valid.map(i=>({id:uid(),name:i.name,qty:i.qty||"",unit:i.unit||"g"}))};
      s.recipes.push(r);
      s.plan[dk]=s.plan[dk]||{};
      s.plan[dk][mk]=[{id:uid(),recipeId:r.id}];
    }
  }
  return s;
}
function newDb(){
  const d={profiles:{},shared:{},meta:{}};
  for(const [k] of PROFILES){d.profiles[k]={recipes:[],plan:{}};d.meta[k]={base:0,dirty:false,t:0,seq:0};}
  for(const sc of SCOPES)d.shared[sc]={};
  return d;
}
db=newDb();
function normalizeDb(d){
  const n=newDb();
  for(const [k] of PROFILES){
    const src=(d.profiles&&d.profiles[k])||{};
    n.profiles[k]={recipes:(Array.isArray(src.recipes)?src.recipes:[]).map(fixRecipe),plan:(src.plan&&typeof src.plan==="object")?src.plan:{}};
    const m=(d.meta&&d.meta[k])||{};
    n.meta[k]={base:Number(m.base)||0,dirty:!!m.dirty,t:Number(m.t)||0,seq:0};
  }
  for(const sc of SCOPES){
    const src=(d.shared&&d.shared[sc])||{};
    for(const key in src){const e=src[key];if(e&&typeof e.t==="number")n.shared[sc][key]={c:!!e.c,t:e.t};}
  }
  return n;
}
function finishLoad(){state=db.profiles[active];shopScope=active;}
async function load(){
  try{const a=localStorage.getItem(ACTIVE_KEY);if(PROFILES.some(x=>x[0]===a))active=a;}catch(e){}
  try{
    const r=await store.get(KEY3);
    if(r&&r.value){db=normalizeDb(JSON.parse(r.value));finishLoad();return;}
  }catch(e){}
  // primo avvio dopo l'aggiornamento: i dati esistenti passano al profilo Nello
  let old=null;
  try{const r=await store.get(KEY);if(r&&r.value){const o=JSON.parse(r.value);old={recipes:o.recipes||[],plan:o.plan||{},checked:o.checked||{}};}}catch(e){}
  if(!old){try{const r=await store.get(OLD_KEY);if(r&&r.value){const o=migrate(JSON.parse(r.value));old={recipes:o.recipes,plan:o.plan,checked:o.checked||{}};}}catch(e){}}
  db=newDb();
  if(old){
    const now=Date.now();
    db.profiles.nello={recipes:old.recipes.map(fixRecipe),plan:old.plan};
    for(const k in old.checked)db.shared.nello[k]={c:true,t:now};
    db.meta.nello.dirty=true;db.meta.nello.t=now;
    await saveLocal();
  }
  finishLoad();
}
async function saveLocal(){try{await store.set(KEY3,JSON.stringify(db));}catch(e){console.error(e);}}
async function save(){
  const m=db.meta[active];m.dirty=true;m.t=Date.now();m.seq=(m.seq||0)+1;
  await saveLocal();scheduleSync();
}
async function saveShared(){await saveLocal();scheduleSync(600);}

/* spunte della lista della spesa (condivise tra i dispositivi) */
function isChecked(scope,key){const e=db.shared[scope]&&db.shared[scope][key];return !!(e&&e.c);}
function setChecked(scope,key,val){db.shared[scope][key]={c:!!val,t:Date.now()};}
function clearChecked(scope){const now=Date.now();const m=db.shared[scope];for(const k in m){if(m[k].c)m[k]={c:false,t:now};}}

/* ---------- Cloud (Firebase Realtime Database, tramite REST) ---------- */
let cloud=null;                       // {u: indirizzo, c: codice, k: chiave}
let syncStatus="off",syncMsg="",lastSync=0;
let syncing=false,syncAgain=false,syncTimer=null,loopsOn=false;
const SYNC_LABELS={off:"Non collegato",busy:"Sincronizzo…",ok:"Sincronizzato",offline:"Offline",error:"Errore"};

function cleanUrl(u){
  u=String(u||"").trim().replace(/\.json$/i,"").replace(/\/+$/,"");
  return /^https:\/\/[^\s\/]+\.(firebaseio\.com|firebasedatabase\.app)$/i.test(u)?u:null;
}
async function householdKey(code){
  const norm=String(code).trim().toLowerCase();
  try{
    if(typeof crypto!=="undefined"&&crypto.subtle){
      const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("piano-pasti:"+norm));
      return "k"+[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
    }
  }catch(e){}
  return "c"+encodeURIComponent(norm).replace(/[.$#\[\]\/%]/g,ch=>"_"+ch.charCodeAt(0).toString(16));
}
async function makeCloud(u,c){
  const url=cleanUrl(u),code=String(c||"").trim();
  if(!url||!code)return null;
  return {u:url,c:code,k:await householdKey(code)};
}
async function rt(method,path,body){
  const opt={method,cache:"no-store"};
  if(body!==undefined){opt.headers={"Content-Type":"application/json"};opt.body=JSON.stringify(body);}
  const r=await fetch(cloud.u+"/h/"+cloud.k+path+".json",opt);
  if(!r.ok){const e=new Error("HTTP "+r.status);e.status=r.status;throw e;}
  return await r.json();
}
function deviceId(){
  let d=null;try{d=localStorage.getItem(DEV_KEY);}catch(e){}
  if(!d){d=uid()+uid();try{localStorage.setItem(DEV_KEY,d);}catch(e){}}
  return d;
}
const encKey=k=>encodeURIComponent(k).replace(/\./g,"%2E");
const decKey=k=>{try{return decodeURIComponent(k);}catch(e){return k;}};

function setSync(st,msg){
  syncStatus=st;syncMsg=msg||"";
  renderSyncChip();
  if(!$("#cloud-dlg").hidden&&cloud)renderCloud("");
}
function renderSyncChip(){
  const b=$("#sync-chip");
  b.innerHTML=`<span class="sd sd-${syncStatus}"></span>${SYNC_LABELS[syncStatus]}`;
  b.setAttribute("aria-label","Sincronizzazione: "+SYNC_LABELS[syncStatus]);
}
function profileHasData(k){
  const d=db.profiles[k];if(d.recipes.length)return true;
  for(const dk in d.plan)for(const mk in d.plan[dk])if(d.plan[dk][mk].length)return true;
  return false;
}
function scheduleSync(ms){
  if(!cloud)return;
  clearTimeout(syncTimer);
  syncTimer=setTimeout(syncNow,ms==null?1500:ms);
}
async function pushProfile(k,rev){
  const m=db.meta[k],seq=m.seq||0;
  await rt("PUT","/profiles/"+k,{d:JSON.stringify(db.profiles[k]),r:rev,t:m.t||Date.now(),w:deviceId()});
  m.base=rev;
  if((m.seq||0)===seq)m.dirty=false;
}
function adoptRemote(k,r){
  let data;try{data=JSON.parse(r.d);}catch(e){return false;}
  const clean={recipes:(Array.isArray(data.recipes)?data.recipes:[]).map(fixRecipe),plan:(data.plan&&typeof data.plan==="object")?data.plan:{}};
  db.profiles[k]=clean;
  const m=db.meta[k];m.base=Number(r.r)||0;m.dirty=false;m.t=Number(r.t)||0;
  if(k===active)state=clean;
  return true;
}
function mergeFirst(k,r){
  // dati locali mai sincronizzati + dati già nel cloud: si tiene il cloud e si aggiungono le ricette locali nuove
  let data;try{data=JSON.parse(r.d);}catch(e){return false;}
  const rec=(Array.isArray(data.recipes)?data.recipes:[]).map(fixRecipe);
  const ids=new Set(rec.map(x=>x.id));
  for(const x of db.profiles[k].recipes)if(!ids.has(x.id))rec.push(x);
  db.profiles[k]={recipes:rec,plan:(data.plan&&typeof data.plan==="object")?data.plan:{}};
  if(k===active)state=db.profiles[k];
  return true;
}
async function syncNow(){
  if(!cloud)return;
  if(syncing){syncAgain=true;return;}
  syncing=true;setSync("busy");
  let changed=false;
  try{
    const remote=(await rt("GET",""))||{};
    const rp=remote.profiles||{};
    for(const [k] of PROFILES){
      const m=db.meta[k],r=rp[k];
      if(!r||typeof r.d!=="string"){
        if(m.dirty||profileHasData(k))await pushProfile(k,Math.max(m.base,0)+1);
        continue;
      }
      const R=Number(r.r)||0;
      if(R===m.base){
        if(m.dirty)await pushProfile(k,R+1);
      }else if(R>m.base){
        if(!m.dirty){if(adoptRemote(k,r))changed=true;}
        else if(m.base===0){if(mergeFirst(k,r)){changed=true;m.seq=(m.seq||0)+1;await pushProfile(k,R+1);}}
        else if((m.t||0)>Number(r.t||0))await pushProfile(k,R+1);
        else if(adoptRemote(k,r))changed=true;
      }else await pushProfile(k,m.base+1);
    }
    const rs=remote.shared||{};
    for(const sc of SCOPES){
      const rem=rs[sc]||{},loc=db.shared[sc],patch={};
      for(const ek in rem){
        const re=rem[ek];if(!re||typeof re.t!=="number")continue;
        const key=decKey(ek),le=loc[key];
        if(!le||le.t<re.t){loc[key]={c:!!re.c,t:re.t};changed=true;}
      }
      for(const key in loc){
        const ek=encKey(key),re=rem[ek];
        if(!re||re.t<loc[key].t)patch[ek]={c:loc[key].c,t:loc[key].t};
      }
      if(Object.keys(patch).length)await rt("PATCH","/shared/"+sc,patch);
    }
    lastSync=Date.now();
    await saveLocal();
    setSync("ok");
    if(changed)refreshUI();
  }catch(e){
    if(e&&(e.status===401||e.status===403))setSync("error","Permesso negato dal database: controlla le regole su Firebase.");
    else if(e&&e.status)setSync("error","Il database ha risposto con un errore ("+e.status+").");
    else setSync("offline","Nessuna connessione: i dati restano sul dispositivo e verranno inviati appena possibile.");
  }finally{
    syncing=false;
    if(syncAgain){syncAgain=false;scheduleSync(300);}
  }
}
function startLoops(){
  if(loopsOn)return;loopsOn=true;
  setInterval(()=>{if(cloud&&!document.hidden)syncNow();},20000);
  document.addEventListener("visibilitychange",()=>{if(cloud&&!document.hidden)syncNow();});
  window.addEventListener("online",()=>{if(cloud)syncNow();});
}
function saveCloudCfg(){try{localStorage.setItem(CLOUD_KEY,JSON.stringify({u:cloud.u,c:cloud.c}));}catch(e){}}
async function initCloud(){
  try{
    const c=JSON.parse(localStorage.getItem(CLOUD_KEY)||"null");
    if(c)cloud=await makeCloud(c.u,c.c);
  }catch(e){}
}
async function handleInvite(){
  const h=location.hash||"";
  if(!h.startsWith("#invito="))return false;
  let cfg=null;
  try{cfg=JSON.parse(decodeURIComponent(atob(h.slice(8))));}catch(e){}
  try{history.replaceState(null,"",location.pathname+location.search);}catch(e){}
  if(!cfg)return false;
  const nc=await makeCloud(cfg.u,cfg.c);
  if(!nc)return false;
  cloud=nc;saveCloudCfg();
  return true;
}
async function connectCloud(u,c){
  const nc=await makeCloud(u,c);
  if(!nc){renderCloud("Controlla l'indirizzo (deve finire con firebasedatabase.app o firebaseio.com) e inserisci il codice.",true);return;}
  const old=cloud;cloud=nc;
  try{await rt("GET","");}
  catch(e){
    cloud=old;
    renderCloud(e&&e.status?(e.status===401||e.status===403?"Permesso negato: controlla le regole del database su Firebase.":"Il database ha risposto con un errore ("+e.status+")."):"Non riesco a raggiungere il database: controlla l'indirizzo e la connessione.",true);
    return;
  }
  saveCloudCfg();
  renderCloud("Collegato. Sincronizzo i dati…");
  await syncNow();
  renderCloud(syncStatus==="ok"?"Collegato e sincronizzato.":"");
}
function disconnectCloud(){
  cloud=null;
  try{localStorage.removeItem(CLOUD_KEY);}catch(e){}
  for(const [k] of PROFILES){db.meta[k].base=0;db.meta[k].dirty=profileHasData(k);}
  saveLocal();
  setSync("off");
  renderCloud("Dispositivo scollegato: i dati restano qui ma non vengono più sincronizzati.");
}

/* finestra di sincronizzazione */
function renderCloud(msg,isErr){
  let h="";
  if(!cloud){
    h+=`<p class="c-line">Collega un database Firebase per avere gli stessi dati su tutti i dispositivi.</p>
      <div class="field"><label for="c-url">Indirizzo del database</label><input id="c-url" type="url" inputmode="url" placeholder="https://…firebasedatabase.app" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
      <div class="field"><label for="c-code">Codice condiviso</label><input id="c-code" type="text" placeholder="Lo stesso su tutti i dispositivi" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
      <button class="primary" id="c-connect" style="width:100%">Collega</button>`;
  }else{
    const t=lastSync?new Date(lastSync).toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"}):"";
    h+=`<p class="c-line"><span class="sd sd-${syncStatus}"></span> <b>${SYNC_LABELS[syncStatus]}</b>${t?` · ultimo aggiornamento alle ${t}`:""}</p>
      <p class="c-line">Database: ${esc(cloud.u.replace("https://",""))}</p>
      <div class="tools"><button class="primary" id="c-sync">Sincronizza ora</button><button class="ghost" id="c-invite">Copia link di invito</button></div>
      <p class="c-line">Per collegare un altro dispositivo, apri da lì il link di invito.</p>
      <button class="ghost" id="c-disc">Scollega questo dispositivo</button>`;
  }
  const m=msg||(cloud&&syncStatus!=="ok"&&syncStatus!=="busy"?syncMsg:"");
  if(m)h+=`<p class="c-msg${(isErr||syncStatus==="error")?" err":""}" role="status">${esc(m)}</p>`;
  $("#c-body").innerHTML=h;
}

$("#c-body").addEventListener("click",async e=>{

function renderDays(){
  let anyCarb=false;
  $("#days").innerHTML=DAYS.map(([k,full,short])=>{
    const n=dayCount(k);
    const c=lunchCarb(k);
    if(c)anyCarb=true;
    return `<button class="day" data-day="${k}" aria-pressed="${k===current}" aria-label="${full}${c?", pranzo con carboidrato":""}">${c?`<span class="carb-dot"></span>`:""}<b>${short}</b><small>${n?n+(n===1?" ricetta":" ricette"):""}</small></button>`;
  }).join("");
  $("#carb-legend").hidden=!anyCarb;
}
function lunchCarb(day){
  return slot(day,"pranzo").some(e=>{const r=recipeById(e.recipeId);return r&&r.carb;});
}
function pickerHtml(mk,tag){
  const recs=state.recipes.filter(r=>picker.all||r.tags.includes(tag));
  const busy=k=>k!==current&&slot(k,mk).some(e=>recipeById(e.recipeId));
  const anyBusy=DAYS.some(([k])=>busy(k));
  const chips=DAYS.map(([k,,short])=>{
    const b=busy(k);
    return `<button class="chip chip-day" data-day="${k}" aria-pressed="${picker.days.includes(k)}" ${k===current||b?"disabled":""}${b?` title="Ha già una ricetta in questo pasto"`:""}>${short}</button>`;
  }).join("");
  let list,anyUsed=false;
  if(recs.length){
    list=recs.map(r=>{
      const u=usage(r.id);if(u)anyUsed=true;
      const times=u+" "+(u===1?"volta":"volte");
      return `<button class="pick" data-rid="${r.id}"><span class="pick-top"><span><b>${esc(rname(r))}</b>${r.carb?`<span class="carb-tag">Carboidrato</span>`:""}</span>${u?`<span class="pick-count" aria-label="Usata ${times} nella settimana">${times}</span>`:""}</span><span class="entry-sub">${esc(summary(r))}</span></button>`;
    }).join("");
  }else{
    list=`<p class="empty">${state.recipes.length?`Nessuna ricetta con il tag «${tagLabel(tag)}».`:"Non hai ancora nessuna ricetta."}</p>`;
  }
  return `<div class="picker">
    <p class="picker-label">Aggiungi anche negli altri giorni (facoltativo)</p>
    <div class="chips">${chips}</div>
    ${anyBusy?`<p class="picker-hint">I giorni disattivati hanno già una ricetta in questo pasto.</p>`:""}
    <div class="pick-list">${list}</div>
    ${anyUsed?`<p class="picker-hint" style="margin:0 0 10px">Il numero a destra indica quante volte la ricetta è già nel piano della settimana.</p>`:""}
    <div class="picker-foot">
      ${state.recipes.length?`<button class="ghost toggle-all">${picker.all?`Solo «${tagLabel(tag)}»`:"Mostra tutte le ricette"}</button>`:""}

    </div>
  </div>`;
}

$("#day-view").addEventListener("keydown",e=>{
  if(e.key!=="Enter"&&e.key!==" ")return;
  const em=e.target.closest&&e.target.closest(".entry-main");if(!em)return;
  e.preventDefault();em.click();
});
let pendingReset=false;
$("#reset").addEventListener("click",e=>{
  const b=e.target;
  if(!pendingReset){
    pendingReset=true;b.textContent="Conferma: svuota il piano";b.classList.add("danger");
    setTimeout(()=>{pendingReset=false;b.textContent="Svuota il piano della settimana";b.classList.remove("danger");},4000);
    return;
  }
  state.plan={};clearChecked(active);pendingReset=false;
  b.textContent="Svuota il piano della settimana";b.classList.remove("danger");
  closePicker();renderDay();refreshCounts();save();saveShared();
});

/* ---------- Ricette ---------- */
function newRecipe(tag,from){
  const r={id:uid(),name:"",desc:"",carb:false,tags:tag?[tag]:[],ingredients:[]};
  state.recipes.push(r);editing=r.id;returnTab=from||null;
  focusSel="#r-name";show("rec");save();
}
function renderRec(){
  const box=$("#rec-view");
  const r=editing&&recipeById(editing);
  if(r){return renderEditor(box,r);}
  editing=null;
  const filters=[["tutte","Tutte"],...TAGS];
  let list=state.recipes.filter(x=>recFilter==="tutte"||x.tags.includes(recFilter));
  list=[...list].sort((a,b)=>rname(a).localeCompare(rname(b),"it"));
  let html=`<div class="rec-top"><h2>Le tue ricette</h2><button class="primary" id="new-rec">Nuova ricetta</button></div>
    <div class="rec-tools"><button class="ghost" id="exp-rec">Esporta ricette</button><button class="ghost" id="imp-rec">Importa ricette</button></div>
    ${ioMsg?`<p class="io-msg" role="status">${esc(ioMsg)}</p>`:""}
    <div class="chips">${filters.map(([k,l])=>`<button class="chip chip-filter" data-f="${k}" aria-pressed="${recFilter===k}">${l}</button>`).join("")}</div>`;
  if(!list.length){
    html+=`<p class="state">${state.recipes.length?"Nessuna ricetta con questo tag.":"Non hai ancora ricette. Creane una e potrai assegnarla ai pasti di uno o più giorni."}</p>`;
  }
  for(const x of list){
    const u=usage(x.id);
    html+=`<button class="rcard" data-rid="${x.id}">
      <span class="rcard-name">${esc(rname(x))}</span>${x.desc&&x.desc.trim()?`<span class="rcard-desc">${esc(x.desc.trim())}</span>`:""}
      <span>${x.tags.length?x.tags.map(t=>`<span class="tag">${tagLabel(t)}</span>`).join(""):`<span class="entry-sub">Nessun tag</span>`}${x.carb?`<span class="carb-tag">Carboidrato</span>`:""}</span>
      <span class="rcard-meta">${x.ingredients.filter(i=>i.name.trim()).length} ingredienti · ${u?`in piano ${u} ${u===1?"volta":"volte"}`:"non ancora in piano"}</span>
    </button>`;
  }
  box.innerHTML=html;
}
function renderEditor(box,r){
  let html=`<button class="ghost back" id="back">${returnTab==="plan"?"‹ Torna al piano":"‹ Tutte le ricette"}</button>
  <div class="editor">
    <div class="block"><label class="lab" for="r-name">Nome della ricetta</label>
      <input id="r-name" type="text" value="${esc(r.name)}" placeholder="Es. Pasta al pomodoro" autocomplete="off"></div>
    <div class="block"><label class="lab" for="r-desc">Descrizione (facoltativa)</label>
      <textarea id="r-desc" rows="3" placeholder="Es. Cuocere la pasta 10 minuti e condire con il sugo.">${esc(r.desc||"")}</textarea></div>
    <div class="block"><span class="lab" style="display:block;font-weight:600;font-size:14px;margin-bottom:6px">Tag</span>
      <div class="chips">${TAGS.map(([k,l])=>`<button class="chip chip-tag" data-t="${k}" aria-pressed="${r.tags.includes(k)}">${l}</button>`).join("")}</div></div>
    <div class="block"><label class="flag"><input type="checkbox" id="r-carb" ${r.carb?"checked":""}> Contiene carboidrato</label></div>
    <div class="block"><h3>Ingredienti</h3><div class="rows">`;
  if(!r.ingredients.length)html+=`<p class="empty">Nessun ingrediente.</p>`;
  for(const it of r.ingredients){
    html+=`<div class="row" data-id="${it.id}">
      <input type="text" class="f-name" list="names" placeholder="Ingrediente" value="${esc(it.name)}" aria-label="Ingrediente" autocomplete="off">
      <input type="text" class="f-qty" inputmode="decimal" placeholder="Qtà" value="${esc(it.qty)}" aria-label="Quantità">
      <select class="f-unit" aria-label="Unità">${Object.keys(UNITS).map(u=>`<option value="${u}"${u===it.unit?" selected":""}>${u}</option>`).join("")}</select>
      <button class="del del-ing" aria-label="Rimuovi ingrediente">×</button>
    </div>`;
  }
  html+=`</div><button class="add add-ing">Aggiungi ingrediente</button></div>
    <div class="footer-actions" style="margin-top:8px"><button class="ghost" id="r-del">Elimina ricetta</button></div>
  </div>`;
  box.innerHTML=html;
  if(focusSel){const el=box.querySelector(focusSel);if(el)el.focus();focusSel=null;}
}
const recView=$("#rec-view");
recView.addEventListener("change",e=>{
  if(e.target.id!=="r-carb"||!editing)return;
  const r=recipeById(editing);if(!r)return;
  r.carb=e.target.checked;refreshCounts();save();
});
recView.addEventListener("click",e=>{
  const t=e.target;
  if(t.closest("#exp-rec"))return exportRecipes();
  if(t.closest("#imp-rec"))return $("#imp-file").click();
  if(t.closest("#new-rec"))return newRecipe(recFilter!=="tutte"?recFilter:null,null);
  if(t.closest(".chip-filter")){recFilter=t.closest(".chip-filter").dataset.f;return renderRec();}
  if(t.closest(".rcard")){editing=t.closest(".rcard").dataset.rid;returnTab=null;return renderRec();}
  const r=editing&&recipeById(editing);if(!r)return;
  if(t.closest("#back")){
    if(!r.name.trim()&&!r.ingredients.some(i=>i.name.trim()))state.recipes=state.recipes.filter(x=>x.id!==r.id);
    editing=null;const rt=returnTab;returnTab=null;save();refreshCounts();
    return show(rt||"rec");
  }
  if(t.closest(".chip-tag")){
    const k=t.closest(".chip-tag").dataset.t;
    r.tags=r.tags.includes(k)?r.tags.filter(x=>x!==k):[...r.tags,k];
    renderRec();save();
  }else if(t.closest(".add-ing")){
    const it={id:uid(),name:"",qty:"",unit:"g"};r.ingredients.push(it);
    focusSel=`[data-id="${it.id}"] .f-name`;renderRec();save();
  }else if(t.closest(".del-ing")){
    const id=t.closest(".row").dataset.id;
    r.ingredients=r.ingredients.filter(i=>i.id!==id);
    renderRec();refreshCounts();save();
  }else if(t.closest("#r-del")){
    const b=t.closest("#r-del"),u=usage(r.id);
    if(!b.classList.contains("danger")){
      b.classList.add("danger");
      b.textContent=u?`Conferma: è in piano ${u} ${u===1?"volta":"volte"}`:"Conferma eliminazione";
      setTimeout(()=>{if(b.isConnected){b.classList.remove("danger");b.textContent="Elimina ricetta";}},4000);
      return;
    }
    state.recipes=state.recipes.filter(x=>x.id!==r.id);
    for(const d in state.plan)for(const m in state.plan[d])state.plan[d][m]=state.plan[d][m].filter(x=>x.recipeId!==r.id);
    editing=null;const rt=returnTab;returnTab=null;save();refreshCounts();show(rt||"rec");
  }
});
recView.addEventListener("input",e=>{
  const r=editing&&recipeById(editing);if(!r)return;
  if(e.target.id==="r-name"){r.name=e.target.value;save();return;}
  if(e.target.id==="r-desc"){r.desc=e.target.value;save();return;}
  const row=e.target.closest(".row");if(!row)return;
  const it=r.ingredients.find(i=>i.id===row.dataset.id);if(!it)return;
  if(e.target.classList.contains("f-name"))it.name=e.target.value;
  else if(e.target.classList.contains("f-qty"))it.qty=e.target.value;
  else if(e.target.classList.contains("f-unit"))it.unit=e.target.value;
  refreshCounts();save();
});

/* ---------- Esporta / importa ricette ---------- */
function setIoMsg(msg){
  ioMsg=msg;
  if(!$("#view-rec").hidden&&!editing)renderRec();
  setTimeout(()=>{
    if(ioMsg===msg){ioMsg="";if(!$("#view-rec").hidden&&!editing)renderRec();}
  },7000);
}
function exportRecipes(){
  const n=state.recipes.length;
  if(!n)return setIoMsg("Non ci sono ricette da esportare.");
  const data={app:"piano-pasti",version:3,exported:new Date().toISOString(),recipes:state.recipes};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download="ricette-piano-pasti-"+new Date().toISOString().slice(0,10)+".json";
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
  setIoMsg((n===1?"Esportata 1 ricetta":"Esportate "+n+" ricette")+": cerca il file nella cartella Download.");
}
$("#imp-file").addEventListener("change",async e=>{
  const f=e.target.files&&e.target.files[0];
  e.target.value="";
  if(!f)return;
  try{
    const data=JSON.parse(await f.text());
    const raw=Array.isArray(data)?data:data.recipes;
    if(!Array.isArray(raw))throw new Error("formato");
    let added=0,updated=0;
    for(const x of raw){
      if(!x||typeof x!=="object")continue;
      const hadCarb=("carb" in x);
      const r=fixRecipe(x);
      if(!r.name.trim()&&!r.ingredients.some(i=>i.name.trim()))continue;
      const i=state.recipes.findIndex(y=>y.id===r.id);
      if(i>=0){if(!hadCarb)r.carb=state.recipes[i].carb;state.recipes[i]=r;updated++;}else{state.recipes.push(r);added++;}
    }
    const n=added+updated;
    save();refreshCounts();
    setIoMsg(n?((n===1?"Importata 1 ricetta":"Importate "+n+" ricette")+" ("+added+" nuove, "+updated+" aggiornate)."):"Nessuna ricetta valida nel file.");
  }catch(err){
    setIoMsg("Il file non è valido: scegli un file esportato da questa app.");
  }
});

/* ---------- Lista della spesa ---------- */
function parseQty(v){
  const n=parseFloat(String(v).replace(",","."));
  return isFinite(n)&&n>0?n:0;
}
const fmtNum=n=>new Intl.NumberFormat("it-IT",{maximumFractionDigits:2}).format(n);
function fmtTotal(fam,total){
  if(!total)return "";
  return fmtNum(total)+(fam==="m"?" g":" pz");
}
function buildShopping(scope){
  scope=scope||shopScope;
  const who=scope==="insieme"?PROFILES.map(x=>x[0]):[scope];
  const map=new Map();
  for(const k of who){
    const dp=db.profiles[k],pname=PROFILES.find(x=>x[0]===k)[1];
    for(const [dk] of DAYS){
      for(const [mk] of MEALS){
        for(const en of ((dp.plan[dk]||{})[mk]||[])){
          const r=dp.recipes.find(x=>x.id===en.recipeId);if(!r)continue;
          for(const it of r.ingredients){
            const name=it.name.trim().replace(/\s+/g," ");if(!name)continue;
            const [fam,mult]=UNITS[it.unit]||UNITS.g;
            const key=name.toLowerCase()+"|"+fam;
            if(!map.has(key))map.set(key,{key,name:name.charAt(0).toUpperCase()+name.slice(1),fam,total:0,uses:new Map()});
            const x=map.get(key);
            x.total+=parseQty(it.qty)*mult;
            const label=scope==="insieme"?`${rname(r)} (${pname})`:rname(r);
            x.uses.set(label,(x.uses.get(label)||0)+1);
          }
        }
      }
    }
  }
  return [...map.values()].sort((a,b)=>a.name.localeCompare(b.name,"it"));
}
function renderScope(){
  const items=[...PROFILES,["insieme","Insieme"]];
  $("#shop-scope").innerHTML=items.map(([k,l])=>`<button data-s="${k}" aria-pressed="${k===shopScope}">${l}</button>`).join("");
}
$("#shop-scope").addEventListener("click",e=>{
  const b=e.target.closest("[data-s]");if(!b)return;
  shopScope=b.dataset.s;renderShop();updateBadge();
});
function exportText(){
  const inc=$("#inc-done").checked;
  return buildShopping()
    .filter(i=>inc||!isChecked(shopScope,i.key))
    .map(i=>"• "+i.name+(i.total?" – "+fmtTotal(i.fam,i.total):""))
    .join("\n");
}
function renderShop(){
  renderScope();
  const items=buildShopping();
  $("#export-text").value=exportText();
  const done=items.filter(i=>isChecked(shopScope,i.key)).length;
  $("#progress").textContent=items.length?`${done} di ${items.length} nel carrello`:"";
  if(!items.length){
    $("#shop-view").innerHTML=`<p class="state">La lista è vuota. Assegna delle ricette ai pasti nel Piano e gli ingredienti compariranno qui.</p>`;
    return;
  }
  const ordered=[...items.filter(i=>!isChecked(shopScope,i.key)),...items.filter(i=>isChecked(shopScope,i.key))];
  $("#shop-view").innerHTML=`<ul class="shop">`+ordered.map(i=>{
    const uses=[...i.uses].map(([n,c])=>n+(c>1?` ×${c}`:"")).join(", ");
    return `<li class="${isChecked(shopScope,i.key)?"done":""}"><label>
      <input type="checkbox" data-key="${esc(i.key)}" ${isChecked(shopScope,i.key)?"checked":""}>
      <span class="item-main"><span><span class="item-name">${esc(i.name)}</span><span class="item-uses">${esc(uses)}</span></span>
      <span class="item-qty">${fmtTotal(i.fam,i.total)}</span></span>
    </label></li>`;}).join("")+`</ul>`;
}
$("#shop-view").addEventListener("change",e=>{
  const k=e.target.dataset.key;if(k===undefined)return;
  setChecked(shopScope,k,e.target.checked);
  renderShop();updateBadge();saveShared();
});
$("#uncheck").addEventListener("click",()=>{clearChecked(shopScope);renderShop();saveShared();});
function flash(b,msg,orig){b.textContent=msg;setTimeout(()=>b.textContent=orig,1800);}
$("#inc-done").addEventListener("change",()=>{$("#export-text").value=exportText();});
$("#export-text").addEventListener("focus",e=>e.target.select());
$("#copy").addEventListener("click",async e=>{
  const b=e.target,txt=exportText();
  if(!txt)return flash(b,"Niente da copiare","Copia la lista");
  let ok=false;
  try{await navigator.clipboard.writeText(txt);ok=true;}catch(_){
    const ta=$("#export-text");ta.removeAttribute("readonly");ta.select();
    try{ok=document.execCommand("copy");}catch(__){}
    ta.setAttribute("readonly","");
  }
  if(!ok)$(".export").open=true;
  flash(b,ok?"Lista copiata":"Copia non riuscita: seleziona il testo qui sotto","Copia la lista");
});
if(!navigator.share)$("#share").hidden=true;
$("#share").addEventListener("click",async e=>{
  const b=e.target,txt=exportText();
  if(!txt)return flash(b,"Niente da condividere","Condividi nelle note");
  try{await navigator.share({title:"Lista della spesa – "+({nello:"Nello",emma:"Emma",insieme:"Nello ed Emma"}[shopScope]),text:txt});}
  catch(err){if(err&&err.name!=="AbortError")flash(b,"Condivisione non riuscita","Condividi nelle note");}
});

/* ---------- Comuni ---------- */
function refreshNames(){
  const set=new Set();
  for(const r of state.recipes)for(const i of r.ingredients){const n=i.name.trim();if(n)set.add(n.charAt(0).toUpperCase()+n.slice(1));}
  $("#names").innerHTML=[...set].sort((a,b)=>a.localeCompare(b,"it")).map(n=>`<option value="${esc(n)}">`).join("");
}
function updateBadge(){
  const n=buildShopping().length;
  const b=$("#badge");b.textContent=n;b.hidden=!n;
}
function refreshCounts(){renderDays();updateBadge();refreshNames();}

/* ---------- Dettaglio ricetta (sola lettura) ---------- */
let lastFocus=null,detailPushed=false;
function openDetail(rid,from){
  const r=recipeById(rid);if(!r)return;
  lastFocus=from||null;
  $("#d-title").textContent=rname(r);
  $("#d-tags").innerHTML=r.tags.map(t=>`<span class="tag">${tagLabel(t)}</span>`).join("")+(r.carb?`<span class="carb-tag">Carboidrato</span>`:"");
  const ings=r.ingredients.filter(i=>i.name.trim());
  let html="";
  if((r.desc||"").trim())html+=`<div class="sec">Descrizione</div><p class="d-text">${esc(r.desc.trim())}</p>`;
  html+=`<div class="sec">Ingredienti</div>`;
  html+=ings.length
    ?`<ul class="ing">${ings.map(i=>{const n=parseQty(i.qty);return `<li><span>${esc(i.name.trim())}</span><span>${n?fmtNum(n)+" "+esc(i.unit):""}</span></li>`;}).join("")}</ul>`
    :`<p class="empty">Nessun ingrediente.</p>`;
  $("#d-body").innerHTML=html;
  $("#d-body").scrollTop=0;
  $("#detail").hidden=false;
  document.body.style.overflow="hidden";
  $("#d-close").focus();
  // il tasto Indietro di Android chiude il popup invece di uscire dall'app
  try{history.pushState({detail:1},"");detailPushed=true;}catch(_){detailPushed=false;}
}
function closeDetail(fromPop){
  const o=$("#detail");if(o.hidden)return;
  o.hidden=true;document.body.style.overflow="";
  if(detailPushed){detailPushed=false;if(fromPop!==true){try{history.back();}catch(_){}}}
  if(lastFocus&&lastFocus.focus&&lastFocus.isConnected!==false)lastFocus.focus();
  lastFocus=null;
}
$("#d-close").addEventListener("click",closeDetail);
window.addEventListener("popstate",()=>closeDetail(true));
$("#detail").addEventListener("click",e=>{if(e.target===$("#detail"))closeDetail();});
document.addEventListener("keydown",e=>{
  if($("#detail").hidden)return;
  if(e.key==="Escape")closeDetail();
  else if(e.key==="Tab"){e.preventDefault();$("#d-close").focus();}
});

function show(tab){
  closeDetail();currentTab=tab;
  for(const t of ["plan","rec","shop"]){
    $("#tab-"+t).setAttribute("aria-selected",t===tab);
    $("#view-"+t).hidden=t!==tab;
  }
  if(tab==="plan"){renderDays();renderDay();}
  if(tab==="rec")renderRec();
  if(tab==="shop")renderShop();
}
$("#tab-plan").addEventListener("click",()=>{editing=null;returnTab=null;show("plan");});
$("#tab-rec").addEventListener("click",()=>{editing=null;returnTab=null;show("rec");});
$("#tab-shop").addEventListener("click",()=>{editing=null;returnTab=null;show("shop");});

(async()=>{
  await load();
  const invited=await handleInvite();
  if(!invited)await initCloud();
  refreshNames();updateBadge();renderProfiles();show("plan");
  startLoops();
  if(cloud){
    setSync("busy");
    await syncNow();
    if(invited)openCloud("Dispositivo collegato: i dati sono stati scaricati.");
  }else setSync("off");
})();
</script>
